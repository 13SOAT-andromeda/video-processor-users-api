openapi: 3.0.3
info:
  title: video-processor-users-api
  description: >
    CRUD de usuários. Todas as rotas exigem role `administrator` (checada a partir
    do contexto injetado pelo authorizer e reconferida no handler). Ao criar ou
    atualizar um usuário, a API grava tanto o perfil administrativo (RDS) quanto
    a credencial de autenticação (DynamoDB `auth-credentials`) — ver
    docs/superpowers/specs/2026-07-11-users-api-design.md, seções 2 e 4.
  version: "1.0.0"
servers:
  - url: /users
    description: Base path do serviço (montado atrás do API Gateway/authorizer)

tags:
  - name: users

security:
  - bearerAuth: []

paths:
  /:
    get:
      tags: [users]
      summary: Lista usuários (paginado)
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada de usuários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/InvalidPayload'
    post:
      tags: [users]
      summary: Cria um usuário (perfil + credencial de autenticação)
      description: >
        Grava o item de credencial no DynamoDB (`auth-credentials`) e o perfil
        no RDS — ver seção 4, item 5, da spec (ordem de escrita e tratamento de
        falha parcial).
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              name: John Doe
              email: john.doe9@example.com
              password: MockAdminPass!2025
              role: user
              document: 652.904.150-84
      responses:
        '201':
          description: Usuário e credencial de autenticação criados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
              example:
                status: success
                message: User successfully created
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        '400':
          $ref: '#/components/responses/InvalidPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      summary: Busca um usuário por ID
      operationId: getUserById
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [users]
      summary: Atualiza um usuário (perfil e, opcionalmente, credencial de autenticação)
      description: >
        `password` é opcional: se omitido, a credencial de autenticação
        existente não é alterada (ver assinatura `Update(ctx, u, passwordHash
        *string)` na seção 2 da spec).
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'
        '400':
          $ref: '#/components/responses/InvalidPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [users]
      summary: Remove um usuário (perfil e credencial de autenticação)
      description: >
        Remove tanto o registro RDS quanto o item DynamoDB (`auth-credentials`)
        — ver seção 4, item 3, da spec.
      operationId: deleteUser
      responses:
        '200':
          description: Usuário removido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token validado pelo authorizer; role `administrator` exigida.

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0

  schemas:
    Role:
      type: string
      enum: [administrator, user]

    User:
      type: object
      description: DTO de resposta — nunca inclui password_hash (ver seção 2 da spec).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        document:
          type: string
          description: CPF, formato "000.000.000-00"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, email, role, document, created_at, updated_at]

    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        limit:
          type: integer
        offset:
          type: integer

    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          description: Senha em texto plano — nunca aceitar hash já pronto vindo do client.
        role:
          $ref: '#/components/schemas/Role'
        document:
          type: string
          description: CPF com dígito verificador válido
      required: [name, email, password, role, document]

    CreateUserResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: User successfully created
        id:
          type: string
          format: uuid
      required: [status, message, id]

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          description: Opcional — se omitido, a credencial de autenticação não é alterada.
        role:
          $ref: '#/components/schemas/Role'
        document:
          type: string

    UpdateUserResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: User successfully updated
        id:
          type: string
          format: uuid
      required: [status, message, id]

    DeleteUserResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: User successfully deleted
      required: [status, message]

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        code:
          type: string
          enum:
            - INVALID_PAYLOAD
            - EMAIL_ALREADY_EXISTS
            - UNAUTHORIZED
            - FORBIDDEN
            - USER_NOT_FOUND
        message:
          type: string
      required: [status, code, message]

  responses:
    InvalidPayload:
      description: Payload inválido ou e-mail já cadastrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_payload:
              value:
                status: error
                code: INVALID_PAYLOAD
                message: "email: invalid format"
            email_exists:
              value:
                status: error
                code: EMAIL_ALREADY_EXISTS
                message: "email already registered"
    Unauthorized:
      description: Token ausente ou inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: UNAUTHORIZED
            message: "missing or invalid token"
    Forbidden:
      description: Role diferente de administrator
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: FORBIDDEN
            message: "administrator role required"
    NotFound:
      description: Usuário não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: USER_NOT_FOUND
            message: "user not found"
