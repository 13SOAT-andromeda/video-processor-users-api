apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processor-users-api
  namespace: default
  labels:
    app: video-processor-users-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-processor-users-api
  template:
    metadata:
      labels:
        app: video-processor-users-api
        tags.datadoghq.com/env: "production"
        tags.datadoghq.com/service: "video-processor-users-api"
        tags.datadoghq.com/version: "1.0.0"
    spec:
      containers:
        - name: users-api
          image: video-processor-users-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ENV
              value: production
            - name: JWT_SIGNING_KEY_SECRET_NAME
              value: jwt-signing-key-prod
            - name: DB_SSLMODE
              value: require
            # Datadog: DD_AGENT_HOST resolve o IP do node via Downward API,
            # onde o Datadog Agent (DaemonSet) expõe APM/DogStatsD por node.
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_SERVICE
              value: "video-processor-users-api"
            # Reaproveita o valor de ENV definido acima (dependent env var,
            # exige que ENV já esteja definido antes na lista - ver nota).
            - name: DD_ENV
              value: "$(ENV)"
            - name: DD_VERSION
              value: "1.0.0"
            - name: DD_LOGS_INJECTION
              value: "true"
            # us5, não o default genérico do Datadog — este projeto usa
            # us5.datadoghq.com (ver iac-video-processor-infra/prod/datadog.tf,
            # mesma correção). O ponto que realmente importa para
            # traces/logs é o site do Cluster Agent, mas mantemos este valor
            # consistente para o caso de o app-level tracer/profiler
            # precisar falar direto com o Datadog (modo agentless).
            - name: DD_SITE
              value: "us5.datadoghq.com"
          envFrom:
            - secretRef:
                name: aws-session-credentials
            - secretRef:
                name: users-api-db-credentials
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
